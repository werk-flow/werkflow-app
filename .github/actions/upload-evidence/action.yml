name: Upload evidence
description: >-
  Keeps a failed job's verification reports, Playwright runs and server output
  for diagnosis (docs/technical/testing.md, "Failures").
inputs:
  name:
    description: Artifact name
    required: true
runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@v7
      with:
        name: evidence-${{ inputs.name }}
        path: .agent-logs/
        retention-days: 14
        if-no-files-found: ignore
        include-hidden-files: true
