name: CI

# The gate every pull request to main passes (docs/technical/testing.md, "CI").
# `Plan` maps the diff to browser groups with the runner's own selection
# (lib/testing/selection/ci-plan.ts): a pull request's against its base, a push
# to main's against the previous main commit. It fails open: an unreadable diff
# or a tooling change runs every browser group. Only a call with `full` (the
# nightly run and the release gate) runs every browser group by design. `Build`
# makes the run's one production build beside `Plan`, and every browser shard
# serves it. Every job runs its groups through scripts/verify.ts, the same
# engine as a local run. The required check is `Check` at the end of this file.
# `Midnight wait` holds the browser shards around Berlin midnight, so a run never
# starts a group inside the window (ciBrowserHoldUntil in lib/testing/runner/group-schedule.ts).
on:
  # No label event starts a run: a relabel on the same commit cancelled the run in progress and
  # left the required `Check` failed or "Expected". The Unit job reads the PR's labels at run
  # time, and list-growth.yml reruns it when the owner's `approved: list growth` label changes.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_call:
    inputs:
      full:
        description: Why every browser group runs
        type: string
        required: true
  # Proof of the midnight wait on a branch. A caller's run cannot set it, and main refuses it.
  workflow_dispatch:
    inputs:
      midnight_proof_minutes:
        description: 'Proof run only: hold the browser shards this many minutes, as if the midnight window were open'
        type: string
        required: true

permissions:
  contents: read

# A new commit's run cancels the PR's older run. A rerun takes a group of its own commit:
# list-growth.yml may rerun a commit the PR has just left, and that rerun must neither cancel nor
# replace the new head's run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}-${{ inputs.full && 'full' || 'diff' }}${{ github.run_attempt != '1' && format('-rerun-{0}', github.event.pull_request.head.sha || github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      browser: ${{ steps.plan.outputs.browser }}
      shards: ${{ steps.plan.outputs.shards }}
      midnight_until: ${{ steps.plan.outputs.midnight_until }}
      static: ${{ steps.plan.outputs.static }}
      sql: ${{ steps.plan.outputs.sql }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Plan the browser groups
        id: plan
        env:
          FULL: ${{ inputs.full || (inputs.midnight_proof_minutes && 'Midnight proof run') }}
          MIDNIGHT_PROOF_MINUTES: ${{ inputs.midnight_proof_minutes }}
          # A pull request is checked out as GitHub's merge commit with the current main; its first
          # parent is that main, so the plan diffs exactly the PR's own changes. The event's
          # base.sha can predate main's newer commits, which then counted as the PR's own
          # (2026-10-30: #85 ran all 82 groups for #77's heavy-slot.ts). A force push or a new branch has no
          # readable `before`, so the plan fails open to a full run.
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          if test -n "$FULL"; then bun scripts/ci-plan.ts --full "$FULL"
          else bun scripts/ci-plan.ts --base "$BASE"; fi

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup
      - run: bun scripts/verify.ts run --group static:lint
      - uses: ./.github/actions/upload-evidence
        if: failure()
        with:
          name: lint

  static:
    name: Static gates
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # docs:check reads the decision records' history.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # docs:check reads the sibling clones beside the app (docs/README.md, "Sibling repositories").
      - name: Clone the sibling repositories
        env:
          SIBLING_TOKEN: ${{ secrets.SIBLING_REPOSITORIES_TOKEN }}
        run: |
          git clone --quiet --depth 1 https://github.com/werk-flow/werkflow-website ../werkflow-website
          if test -n "$SIBLING_TOKEN"; then
            git clone --quiet --depth 1 "https://x-access-token:${SIBLING_TOKEN}@github.com/werk-flow/werkflow-business" ../werkflow-business
          else
            echo "::warning::SIBLING_REPOSITORIES_TOKEN is not set, so docs:check cannot read the private werkflow-business clone."
            echo "WERKFLOW_UNREADABLE_SIBLINGS=werkflow-business" >> "$GITHUB_ENV"
          fi
      - run: bun scripts/verify.ts run --group "${{ needs.plan.outputs.static }}"
      - uses: ./.github/actions/upload-evidence
        if: failure()
        with:
          name: static

  unit:
    name: Unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Reads the pull request's labels.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # The owner's approval for a shrink-only list to grow (docs/technical/testing.md, "Grow a
      # shrink-only list"). Read now, not from the event, so a rerun after a label change sees it.
      - name: Read the list growth approval
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          labels="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name')"
          if grep -qxF 'approved: list growth' <<< "$labels"; then approved=true; else approved=false; fi
          echo "SHRINK_ONLY_GROWTH_APPROVED=$approved" >> "$GITHUB_ENV"
          echo "approved: list growth = $approved"
      - run: bun scripts/verify.ts run --group unit:all
      - uses: ./.github/actions/upload-evidence
        if: failure()
        with:
          name: unit

  components:
    name: Component contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - run: bun scripts/verify.ts run --group ui:contracts
      - uses: ./.github/actions/upload-evidence
        if: failure()
        with:
          name: components

  sql:
    name: SQL
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/local-stack
        with:
          save-images: 'true'
      - run: bun scripts/verify.ts run --group "${{ needs.plan.outputs.sql }}"
      # The committed types match every committed migration (docs/technical/environments.md, "The migration rule").
      - name: Check the generated types
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: bun run types:check -- --local
      # The owner's demo seeder seeds both companies on the stack with every committed migration.
      # The second run starts with the reset (docs/technical/environments.md, "Work on production").
      - name: Seed the demo companies twice
        run: |
          bun scripts/seed-demo-data.ts --target local
          bun scripts/seed-demo-data.ts --target local
      - uses: ./.github/actions/upload-evidence
        if: failure()
        with:
          name: sql

  # The one production build of the run, beside Plan. The stack's URL and keys are the CLI's fixed
  # defaults, so it needs no stack, and every browser shard serves it.
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/local-stack
        with:
          environment-only: 'true'
      - run: bun run build
      # A tar keeps the symbolic links Next writes under .next/node_modules. The cache stays here.
      - name: Pack the build
        run: tar --create --file "$RUNNER_TEMP/build.tar" --exclude=.next/cache .next
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: ${{ runner.temp }}/build.tar
          # A rerun of failed jobs, possible for 30 days, reuses the passed Build job's artifact.
          retention-days: 30
          if-no-files-found: error
          overwrite: true
      - uses: ./.github/actions/upload-evidence
        if: failure()
        with:
          name: build

  # A shard that started now could reach a group in the midnight start window, so the run waits
  # here. The wait is a job of its own: in a Browser job it would count against that job's timeout
  # and end in a cancellation (#131). It holds one idle runner and needs no checkout.
  midnight:
    name: Midnight wait
    needs: plan
    if: needs.plan.outputs.midnight_until != ''
    runs-on: ubuntu-24.04
    # Above the longest hold, CI_MIDNIGHT_HOLD_MAX_MS; a test keeps the two in step.
    timeout-minutes: 80
    permissions: {}
    steps:
      # GitHub shows a job's summary when the job ends, so Plan says why the run waits.
      - name: Wait until the shards may start
        env:
          UNTIL: ${{ needs.plan.outputs.midnight_until }}
        run: |
          end="$(date --date "$UNTIL" +%s)"
          while left=$((end - $(date +%s))); test "$left" -gt 0; do
            echo "Waiting for the midnight start window: $(((left + 59) / 60)) min left, until $UNTIL."
            sleep "$((left < 60 ? left : 60))"
          done

  browser:
    name: Browser ${{ matrix.shard }}
    needs: [plan, midnight]
    # `midnight` is skipped on almost every run, and a skipped need skips this job by default.
    if: ${{ !cancelled() && needs.plan.outputs.browser == 'true' && contains(fromJSON('["success", "skipped"]'), needs.midnight.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Reads the Build job's state.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # DIAGNOSTIC (never merged): every shard repeats the four groups that hit the teardown error.
        include: ${{ fromJSON('[{"shard":1,"groups":"golden:gg-00,golden:p1-12,golden:p1-04,audit:wave-1:a2-anfragen"},{"shard":2,"groups":"golden:gg-00,golden:p1-12,golden:p1-04,audit:wave-1:a2-anfragen"},{"shard":3,"groups":"golden:gg-00,golden:p1-12,golden:p1-04,audit:wave-1:a2-anfragen"},{"shard":4,"groups":"golden:gg-00,golden:p1-12,golden:p1-04,audit:wave-1:a2-anfragen"},{"shard":5,"groups":"golden:gg-00,golden:p1-12,golden:p1-04,audit:wave-1:a2-anfragen"},{"shard":6,"groups":"golden:gg-00,golden:p1-12,golden:p1-04,audit:wave-1:a2-anfragen"},{"shard":7,"groups":"golden:gg-00,golden:p1-12,golden:p1-04,audit:wave-1:a2-anfragen"},{"shard":8,"groups":"golden:gg-00,golden:p1-12,golden:p1-04,audit:wave-1:a2-anfragen"},{"shard":9,"groups":"golden:gg-00,golden:p1-12,golden:p1-04,audit:wave-1:a2-anfragen"},{"shard":10,"groups":"golden:gg-00,golden:p1-12,golden:p1-04,audit:wave-1:a2-anfragen"}]') }}
    steps:
      # The stack's images, the pinned Playwright image, the build and a capture group's screenshots
      # filled a runner's disk (2026-10-31: 98 MB left, then Chromium crashed). The image's unused
      # toolchains hold far more than the shard needs.
      - name: Free the runner's disk
        run: |
          df --human-readable /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df --human-readable /
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/local-stack
      - uses: ./.github/actions/playwright
      # A shard needs only Plan, so its stack starts while Build runs; it waits for the build here.
      # The jobs list holds each job's latest attempt; called by another workflow, the job is
      # named `<caller> / Build`.
      - name: Wait for the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 1200))
          until conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "Build" or (.name | endswith(" / Build")))][0].conclusion // empty')" \
            && test -n "$conclusion"; do
            test $SECONDS -lt $deadline || { echo "::error::The Build job did not finish within its 20 min timeout."; exit 1; }
            sleep 15
          done
          test "$conclusion" = success || { echo "::error::The Build job ended with $conclusion."; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: ${{ runner.temp }}
      # The server proves the build is this checkout's source and environment, then serves it for the whole job.
      - name: Start the test server
        run: |
          tar --extract --file "$RUNNER_TEMP/build.tar"
          nohup bun run test:server local --prebuilt > "$RUNNER_TEMP/test-server.log" 2>&1 &
          server=$!
          deadline=$((SECONDS + 900))
          until grep -q 'Serving the recorded local build' "$RUNNER_TEMP/test-server.log" \
            && curl --silent --fail --output /dev/null http://localhost:3000/login; do
            if ! kill -0 "$server" 2> /dev/null || test $SECONDS -ge $deadline; then
              cat "$RUNNER_TEMP/test-server.log"
              exit 1
            fi
            sleep 5
          done
          tail -n 5 "$RUNNER_TEMP/test-server.log"
      - name: Run browser groups
        # One worker: the stack, the server and a second browser outran a shared runner's four cores.
        # Untimed: a shared runner's load makes wall clock noise, so a wall-clock group of a full run
        # proves its steps and judges no timing. No other group's verdict changes.
        run: bun scripts/verify.ts run --group "${{ matrix.groups }}" --jobs 1 --untimed
      - name: Copy the server output
        if: failure()
        run: |
          mkdir -p .agent-logs
          cp "$RUNNER_TEMP/test-server.log" .agent-logs/
      - uses: ./.github/actions/upload-evidence
        if: failure()
        with:
          name: browser-${{ matrix.shard }}

  # The one required status check. It fails unless every job passed, or the
  # browser shards were skipped because the plan selected no browser group, or
  # the midnight wait was skipped because the plan set no hold.
  # `always()`, never `!cancelled()`: a cancelled run reports a failed Check,
  # and a skipped Check would count as passed.
  check:
    name: Check
    if: always()
    needs: [plan, lint, static, unit, components, sql, build, midnight, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '.plan.outputs as $plan | all(to_entries[];
            .value.result == "success"
            or (.key == "browser" and .value.result == "skipped" and $plan.browser == "false")
            or (.key == "midnight" and .value.result == "skipped" and ($plan.midnight_until // "") == ""))' > /dev/null
