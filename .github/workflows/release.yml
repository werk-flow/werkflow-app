name: release

# The owner's release (docs/technical/environments.md, "Release and rollback").
# The owner starts it, or an agent does when the owner asks for a release in
# its thread: gh workflow run release. It releases the head of main.
on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release main
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # The deploy key is the only actor the production ruleset lets update the branch.
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.PRODUCTION_DEPLOY_KEY }}

      - name: Require a green Check on the main commit
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          passed="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?check_name=Check" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')"
          if test "$passed" -lt 1; then
            echo "::error::main is at ${sha}, which has no successful Check run. Wait for CI on main, or repair it."
            exit 1
          fi
          git merge-base --is-ancestor origin/production "$sha" \
            || { echo "::error::production is not an ancestor of main; it only ever moves forward."; exit 1; }
          echo "Releasing ${sha}:"
          git log --oneline origin/production.."$sha"

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      # Migrations first, so production code never runs ahead of its schema. They are
      # expand-only, so the running production build keeps working against the new schema.
      - name: Apply pending migrations to PROD
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: supabase db push --db-url "$DATABASE_URL"

      - name: Deploy the edge functions to PROD
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref jbgaqpdjauzoocplgdsn

      - name: Advance production
        run: git push origin "${{ steps.candidate.outputs.sha }}:refs/heads/production"

      # Vercel builds production from the production branch. After an Instant Rollback it
      # stops assigning the domain to new production builds, so the release promotes explicitly.
      - name: Promote the production build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          query="projectId=prj_h5ZIXgvJqyy4A7Qqy8Z0j9Ovo86R&teamId=team_B8v4QHjpjZWyFXo6wkhiXkgN&target=production&limit=20"
          deadline=$((SECONDS + 1500))
          while :; do
            deployment="$(curl --fail --silent --show-error -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?${query}" \
              | jq -r --arg sha "$SHA" '[.deployments[] | select(.meta.githubCommitSha == $sha)][0] // empty | "\(.uid) \(.state)"')"
            case "${deployment#* }" in
              READY) break ;;
              ERROR | CANCELED) echo "::error::Production build ${deployment}"; exit 1 ;;
            esac
            test $SECONDS -lt $deadline || { echo "::error::No ready production build of ${SHA} after 25 minutes."; exit 1; }
            sleep 15
          done
          npx --yes vercel@65 promote "${deployment%% *}" --yes --scope werkflows-projects --token "$VERCEL_TOKEN"
          echo "Production serves ${SHA} (${deployment%% *})."
