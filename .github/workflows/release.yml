name: release

# The owner's release (docs/technical/environments.md, "Release and rollback").
# It runs each weekday at 07:00 Berlin, or by hand: gh workflow run release. It releases
# the main commit it starts on, and only after a green full run on exactly that
# commit: a nightly or manual one it finds, or its own. A scheduled run ends without
# a change when main equals production or its newest full run is red
# (.github/scripts/release-candidate.sh). A failed release, or a scheduled one that
# stopped at a red full run, opens or updates the issue "CI alert: release"; the next
# release that ships closes it.
on:
  # GitHub starts this repository's scheduled runs up to 10 hours late, so a cron line at 07:00
  # runs in the working day. This one fires the evening before a weekday, and the Hold job
  # waits for 07:00. It stays a schedule event, so it decides as a scheduled run.
  schedule:
    - cron: '30 22 * * 0-4'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      dry_run:
        description: Decide like a scheduled run, then stop before the full run and any change to PROD
        type: boolean
        default: false
      alert_proof:
        description: 'Proof run only: failure, success, red-run or no-change. Decides and ships nothing; reports on "CI alert: release (proof)"'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

# The Vercel project that serves app.werk-flow.app.
env:
  VERCEL_TEAM_ID: team_B8v4QHjpjZWyFXo6wkhiXkgN
  VERCEL_PROJECT_ID: prj_h5ZIXgvJqyy4A7Qqy8Z0j9Ovo86R

jobs:
  hold:
    name: Hold until 07:00
    # Only a scheduled run waits. A job lasts 6 hours at most, so two legs in turn cover the
    # evening: the second ends at once when the first reached 07:00. A failed leg stops the
    # release, and the alert reports it.
    strategy:
      max-parallel: 1
      matrix:
        leg: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      # Only the script is read; no step needs the job token in .git/config.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: github.event_name == 'schedule'
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Wait for 07:00 Berlin
        if: github.event_name == 'schedule'
        run: bash .github/scripts/hold-until.sh 07:00

  candidate:
    name: Find a full run
    needs: hold
    # Without a successful candidate no later job runs, so a proof run cannot ship.
    if: ${{ !inputs.alert_proof }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      verified: ${{ steps.candidate.outputs.verified }}
      release: ${{ steps.candidate.outputs.release }}
      skip: ${{ steps.candidate.outputs.skip }}
      skip_reason: ${{ steps.candidate.outputs.skip_reason }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Decide the release
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.dry_run && 'dry-run' || github.event_name == 'schedule' && 'scheduled' || 'manual' }}
        run: bash .github/scripts/release-candidate.sh "$MODE"

  full:
    name: Full run
    needs: candidate
    if: needs.candidate.outputs.release == 'true' && needs.candidate.outputs.verified != 'true' && !inputs.dry_run
    # A called workflow gets no permission its caller lacks: ci.yml's Unit job asks for pull-requests.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      full: Release ${{ needs.candidate.outputs.sha }}
    secrets: inherit

  release:
    name: Release main
    needs: [candidate, full]
    # Ships only when the candidate had a green full run or its own full run passed.
    if: >-
      !cancelled() && needs.candidate.result == 'success'
      && needs.candidate.outputs.release == 'true' && !inputs.dry_run
      && (needs.full.result == 'success' || (needs.full.result == 'skipped' && needs.candidate.outputs.verified == 'true'))
    # The PROD secrets live in this environment only, and only main may use it. By the owner's
    # decision it has no approval step: a scheduled or manual run is a release the owner wants.
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      deployment: ${{ steps.promote.outputs.deployment }}
    steps:
      # The deploy key is the only actor the production ruleset lets update the branch.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.PRODUCTION_DEPLOY_KEY }}

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.116.0

      # Migrations first, so production code never runs ahead of its schema. They are
      # expand-only, so the running production build keeps working against the new schema.
      - name: Apply pending migrations to PROD
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: supabase db push --db-url "$DATABASE_URL"

      # --use-api bundles on Supabase's side, so the runner pulls no Docker image and meets no registry rate limit.
      # The functions are named: each checks its own caller (the mail functions a secret key,
      # health its token), so none needs a JWT. A new function deploys only once it is named here,
      # and lib/security/edge-functions.test.ts fails until it is. A flag, not supabase/config.toml:
      # CI's stack-image cache is keyed on that file.
      - name: Deploy the edge functions to PROD
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy send-invite-email send-email-change-current-otp health --project-ref jbgaqpdjauzoocplgdsn --use-api --no-verify-jwt

      - name: Advance production
        env:
          SHA: ${{ needs.candidate.outputs.sha }}
        run: git push origin "${SHA}:refs/heads/production"

      # Vercel builds production from the production branch. After an Instant Rollback it
      # stops assigning the domain to new production builds, so the release promotes explicitly.
      # A failed build gets one redeploy, whose own id the step then waits for: a rerun of this
      # workflow pushes the same commit, which starts no build, and lands here too.
      - name: Promote the production build
        id: promote
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          api() { curl --fail --silent --show-error -H "Authorization: Bearer $VERCEL_TOKEN" "$@"; }
          vercel() { npx --yes vercel@65 "$@" --scope werkflows-projects --token "$VERCEL_TOKEN"; }
          team="teamId=${VERCEL_TEAM_ID}"
          query="projectId=${VERCEL_PROJECT_ID}&${team}&target=production&limit=20"
          deadline=$((SECONDS + 1800))
          id=""
          redeployed=false
          while :; do
            if test -z "$id"; then
              id="$(api "https://api.vercel.com/v6/deployments?${query}" \
                | jq -r --arg sha "$SHA" '[.deployments[] | select(.meta.githubCommitSha == $sha)][0].uid // empty')"
            fi
            # The production build may not be listed yet; keep polling with an empty state.
            state=""
            if test -n "$id"; then
              state="$(api "https://api.vercel.com/v13/deployments/${id}?${team}" | jq -r .readyState)"
            fi
            case "$state" in
              READY) break ;;
              ERROR | CANCELED)
                if $redeployed; then echo "::error::The production build of ${SHA} failed twice (${id})."; exit 1; fi
                echo "::warning::Production build ${id} ended ${state}; redeploying it once."
                url="$(vercel redeploy "$id" --target production --no-wait | tail -n 1)"
                id="$(api "https://api.vercel.com/v13/deployments/${url#https://}?${team}" | jq -r .id)"
                redeployed=true ;;
            esac
            test $SECONDS -lt $deadline || { echo "::error::No ready production build of ${SHA} after 30 minutes."; exit 1; }
            sleep 15
          done
          # Vercel may already have assigned the domain to this build, and promoting the current
          # production deployment fails with 409. A lookup that fails promotes as before.
          served="$(api "https://api.vercel.com/v4/aliases/app.werk-flow.app?${team}" | jq -r .deploymentId)" || true
          if test "$served" = "$id"; then
            echo "Production already serves ${SHA} (${id})."
          else
            vercel promote "$id" --yes
            echo "Production serves ${SHA} (${id})."
          fi
          echo "deployment=$id" >> "$GITHUB_OUTPUT"

  smoke:
    name: Check production
    needs: [candidate, release]
    # After a release, its build; in a dry run that found a candidate, the build that serves now.
    if: ${{ !cancelled() && ((inputs.dry_run && needs.candidate.outputs.release == 'true') || needs.release.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Only the scripts are read; no step needs the job token in .git/config.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Data-free reads only (.github/scripts/release-smoke.sh). A red check means: roll back through
      # Vercel and report (docs/technical/environments.md, "Release and rollback", step 3).
      - name: Smoke-check production without reading its data
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          HEALTH_CHECK_TOKEN: ${{ secrets.HEALTH_CHECK_TOKEN }}
          APP_URL: https://app.werk-flow.app
          HEALTH_URL: https://jbgaqpdjauzoocplgdsn.supabase.co/functions/v1/health
          DEPLOYMENT: ${{ needs.release.outputs.deployment }}
        run: bash .github/scripts/release-smoke.sh "$DEPLOYMENT"

  proof:
    name: Alert proof
    if: ${{ inputs.alert_proof }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: End as asked
        env:
          PROOF: ${{ inputs.alert_proof }}
        run: test "$PROOF" != failure

  alert:
    name: Alert
    needs: [hold, candidate, full, release, smoke, proof]
    # Only a real release on main speaks, and a run a person cancelled says nothing. Nothing
    # needs this job, so it runs after the release decision and changes none.
    if: ${{ !cancelled() && !inputs.dry_run && (github.ref == 'refs/heads/main' || inputs.alert_proof) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # name the failed jobs
      issues: write # open, update and close the alert issue
    steps:
      # Only the script is read; no step needs the job token in .git/config.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Open, update or close the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "CI alert: release${{ inputs.alert_proof && ' (proof)' || '' }}"
          RESULTS: ${{ join(needs.*.result, ' ') }}
          SKIP: ${{ needs.candidate.outputs.skip || inputs.alert_proof }}
          SKIP_REASON: ${{ needs.candidate.outputs.skip_reason || 'Proof run.' }}
        run: bash .github/scripts/alert-issue.sh run "$TITLE" "$RESULTS" "$SKIP" "$SKIP_REASON"
