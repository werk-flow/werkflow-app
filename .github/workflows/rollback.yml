name: rollback

# The way back from a bad release (docs/technical/environments.md, "Release and rollback").
#   gh workflow run rollback.yml                      plan only: names the build it would go back to
#   gh workflow run rollback.yml -f dry_run=false     go back to the previous release
#   gh workflow run rollback.yml -f dry_run=false -f target=<sha>   go back to that released commit
# It promotes the target's ready production build (.github/scripts/release-promote.sh, which the
# release uses too), then redeploys the target commit's edge functions, which Vercel's rollback
# does not cover, and checks production as the release does. It never touches the database:
# migrations are expand-only, so the older code runs against the newer schema, and a data problem
# is fixed forward. It never moves `production`, which only moves forward; the next release from a
# repaired main promotes its own build.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan only, change nothing. Set false to roll back.
        type: boolean
        default: true
      target:
        description: Full sha of a released commit to go back to. Empty means the previous release.
        type: string
        default: ''
      edge_functions:
        description: Redeploy the target commit's edge functions too
        type: boolean
        default: true

permissions:
  contents: read

# The release's group: a rollback never runs beside a release, and neither cancels the other.
concurrency:
  group: release
  cancel-in-progress: false

# The Vercel project that serves app.werk-flow.app.
env:
  VERCEL_TEAM_ID: team_B8v4QHjpjZWyFXo6wkhiXkgN
  VERCEL_PROJECT_ID: prj_h5ZIXgvJqyy4A7Qqy8Z0j9Ovo86R

jobs:
  plan:
    name: Find the build to go back to
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      deployment: ${{ steps.target.outputs.deployment }}
    steps:
      # Only the scripts and the history are read; no step needs the job token in .git/config.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Metadata only: the production builds and the build the domain serves.
      - name: Decide the target
        id: target
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET: ${{ inputs.target }}
        run: bash .github/scripts/rollback-target.sh "$TARGET"

  rollback:
    name: Roll back production
    needs: plan
    if: ${{ !inputs.dry_run }}
    # The PROD secrets live in this environment only, and only main may use it, as for the release.
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The code first: a promote takes seconds, and it is what users see.
      - name: Promote the target's production build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: bash .github/scripts/release-promote.sh "$SHA"

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        if: ${{ inputs.edge_functions }}
        with:
          version: 2.116.0

      # The target's function source with this workflow's deploy script, which an older commit may lack.
      - name: Put the target's edge function source in place
        if: ${{ inputs.edge_functions }}
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          rm -rf supabase/functions
          git checkout "$SHA" -- supabase/functions

      - name: Redeploy the target's edge functions to PROD
        if: ${{ inputs.edge_functions }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash .github/scripts/deploy-edge-functions.sh jbgaqpdjauzoocplgdsn --present-only

  smoke:
    name: Check production
    needs: [plan, rollback]
    # After a rollback, the target build; in a dry run, the build that serves now.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (inputs.dry_run || needs.rollback.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Smoke-check production without reading its data
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          HEALTH_CHECK_TOKEN: ${{ secrets.HEALTH_CHECK_TOKEN }}
          APP_URL: https://app.werk-flow.app
          HEALTH_URL: https://jbgaqpdjauzoocplgdsn.supabase.co/functions/v1/health
          DEPLOYMENT: ${{ !inputs.dry_run && needs.plan.outputs.deployment || '' }}
        run: bash .github/scripts/release-smoke.sh "$DEPLOYMENT"

  alert:
    name: Alert
    needs: [plan, rollback, smoke]
    # A failed rollback leaves production in doubt, so it assigns the owner. A dry run says nothing.
    if: ${{ !cancelled() && !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # name the failed jobs
      issues: write # open, update and close the alert issue
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Open, update or close the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: 'CI alert: rollback'
          AFFECTS_PRODUCTION: true
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: bash .github/scripts/alert-issue.sh run "$TITLE" "$RESULTS"
