name: Production alert

# Opens, updates or closes a production alert for ops/ci-alert.py in werkflow-planning: a
# scheduled release that never started, and the production watcher's deploy, server-error and
# watcher alerts. The PC's gh acts as the owner, and GitHub tells nobody of their own actions,
# so an issue it opened and assigned would reach no inbox. This job writes as github-actions,
# so the owner's assignment notifies them (docs/technical/recovery-and-incidents.md#monitoring).
on:
  workflow_dispatch:
    inputs:
      title:
        description: The alert to open, update or close
        type: choice
        options:
          - 'CI alert: release'
          - 'CI alert: release (proof)'
          - 'Production alert: deploy'
          - 'Production alert: server errors'
          - 'Production alert: watcher'
      action:
        description: keep opens the alert or comments on the open one; close closes it
        type: choice
        options:
          - keep
          - close
        default: keep
      note:
        description: What happened, as the issue's body, a new comment or the closing comment
        type: string
        required: true

permissions: {}

# One group per alert, so two writes to one issue never race. GitHub keeps only the newest
# pending run of a group and cancels the older one; ops/prod_watch.py dispatches again when
# its run ends cancelled or failed.
concurrency:
  group: production-alert-${{ inputs.title }}
  cancel-in-progress: false

jobs:
  alert:
    name: Open, update or close the alert
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # open, update or close the alert issue
    steps:
      # Only the script is read; no step needs the job token in .git/config.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Open, update or close the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ inputs.title }}
          ACTION: ${{ inputs.action }}
          NOTE: ${{ inputs.note }}
          AFFECTS_PRODUCTION: true
        run: bash .github/scripts/alert-issue.sh "$ACTION" "$TITLE" "$NOTE"
