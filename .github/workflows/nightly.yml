name: Nightly

# Every browser group on main once a night, so a date- or data-dependent
# failure surfaces without a change. The wall-clock `audit:performance:*` groups
# run their steps without their timing gate, so a change that breaks a step
# surfaces the next morning (lib/testing/selection/ci-plan.ts). GitHub starts this repository's scheduled runs up
# to 10 hours late, least so in the evening: this cron line starts a run between about
# 19:45 and 00:30 Berlin. One that meets the midnight window waits it out in ci.yml's
# `midnight` job. The release at 03:30 reuses this run when it ended green on the commit it ships.
# A scheduled run skips a head whose newest full run, by the release gate's own reader, is green
# (owner decision 2026-11-21, docs/decisions/0009-pull-requests-and-ci.md): the same tree runs the
# same groups again, and the date look-ahead covers the dates. Only a decision that succeeded and
# found one skips; a failed one starts the full run. A manual run gives a main commit its full run
# before a release, and never skips. A red run on main opens or updates the issue "CI alert:
# nightly"; the next green run closes it. A night that skipped the full run tested nothing new, so
# it closes no alert, and only a failed job of its own opens or updates one.
on:
  schedule:
    - cron: '0 17 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      alert_proof:
        description: 'Proof run only: failure or success. Skips the suite and reports on "CI alert: nightly (proof)"'
        type: string
        default: ''

# The browser shards of ci.yml read the Build job's state.
permissions:
  contents: read
  actions: read

jobs:
  # Whether the newest full run on main's head is green: only a nightly, release or main-full-run
  # run of this exact commit on main, or the CI App's check run, counts, and the newest decides
  # (.github/scripts/full-run-verdict.sh, the release gate's reader). Only a scheduled run asks.
  decide:
    name: Decide
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the full runs of GitHub Actions
      checks: read # the CI App's full runs
    outputs:
      head_has_full_run: ${{ steps.decide.outputs.head_has_full_run }}
    steps:
      # Only the scripts are read; no step needs the job token in .git/config.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Decide whether the head has a full run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/full-run-verdict.sh head

  full:
    # The release reuses a green full run on the commit it ships by this check name,
    # `Full run / Check` (.github/workflows/release.yml).
    name: Full run
    needs: decide
    # Only a decision that succeeded and found a green full run skips it; a skipped (manual) or
    # failed one starts it.
    if: ${{ !cancelled() && !inputs.alert_proof && !(needs.decide.result == 'success' && needs.decide.outputs.head_has_full_run == 'true') }}
    # A called workflow gets no permission its caller lacks: ci.yml's Unit job asks for pull-requests.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      full: Nightly run
    secrets: inherit

  quarantine:
    # A skipped test carries a quarantine comment that names its planning
    # issue (test-hygiene/no-excluded-test); the nightly summary lists them all.
    name: Quarantined tests
    if: ${{ !inputs.alert_proof }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup
      - run: bun scripts/list-quarantines.ts | tee -a "$GITHUB_STEP_SUMMARY"

  proof:
    name: Alert proof
    if: ${{ inputs.alert_proof }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: End as asked
        env:
          PROOF: ${{ inputs.alert_proof }}
        run: test "$PROOF" = success

  alert:
    name: Alert
    needs: [decide, full, quarantine, proof]
    # Only main speaks for the nightly, and a run a person cancelled says nothing about it. Nothing
    # needs this job and the release gate reads only `Full run / Check`, so it changes no release.
    if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || inputs.alert_proof) }}
    # Two runs ending together must not both find no issue. release.yml's runs already queue.
    concurrency: nightly-alert
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # name the failed jobs
      issues: write # open, update and close the alert issue
    steps:
      # Only the script is read; no step needs the job token in .git/config.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Open, update or close the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "CI alert: nightly${{ inputs.alert_proof && ' (proof)' || '' }}"
          RESULTS: ${{ join(needs.*.result, ' ') }}
          SKIPPED_FULL_RUN: ${{ needs.decide.result == 'success' && needs.decide.outputs.head_has_full_run == 'true' }}
        # A night that skipped the full run speaks only for a failed job of its own (the quarantine
        # list): a green one would close an alert that a full run opened, without running one.
        run: |
          if test "$SKIPPED_FULL_RUN" = true && ! grep -qE 'failure|cancelled' <<< "$RESULTS"; then
            echo "The head's full run is green and this night ran none; the alert stays as it is."
            exit 0
          fi
          bash .github/scripts/alert-issue.sh run "$TITLE" "$RESULTS"
