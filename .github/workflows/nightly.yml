name: Nightly

# Every browser group on main once a night, so a date- or data-dependent
# failure surfaces without a change. 02:30 UTC stays clear of the runner's
# Berlin midnight window (MIDNIGHT_START_WINDOW in lib/testing/runner/group-schedule.ts).
# A manual run gives a main commit its full run before a release.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    # The release reuses a green full run on the commit it ships by this check name,
    # `Full run / Check` (.github/workflows/release.yml).
    name: Full run
    uses: ./.github/workflows/ci.yml
    with:
      full: Nightly run
    secrets: inherit

  quarantine:
    # A skipped test carries a quarantine comment that names its planning
    # issue (test-hygiene/no-excluded-test); the nightly summary lists them all.
    name: Quarantined tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup
      - run: bun scripts/list-quarantines.ts | tee -a "$GITHUB_STEP_SUMMARY"
