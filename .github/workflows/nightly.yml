name: Nightly

# Every browser group on main once a night, so a date- or data-dependent
# failure surfaces without a change. The wall-clock `audit:performance:*` groups
# run their steps without their timing gate, so a change that breaks a step
# surfaces the next morning (lib/testing/selection/ci-plan.ts). GitHub starts this repository's scheduled runs up
# to 10 hours late, least so in the evening: this cron line starts a run between about
# 19:45 and 00:30 Berlin. One that meets the midnight window waits it out in ci.yml's
# `midnight` job. It shares the release's cron line, so both usually see one commit,
# and the release at 03:30 reuses this run on it.
# A scheduled run skips a head that already has a green full run, from main-full-run.yml or an
# earlier night (owner decision 2026-11-21, docs/decisions/0009-pull-requests-and-ci.md): the same
# tree runs the same groups again, and the date look-ahead covers the dates. When the decision
# fails, the full run starts. A manual run gives a main commit its full run before a release, and
# never skips. A red run on main opens or updates the issue "CI alert: nightly"; the next green run
# closes it, and a skipped one says nothing.
on:
  schedule:
    - cron: '0 17 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      alert_proof:
        description: 'Proof run only: failure or success. Skips the suite and reports on "CI alert: nightly (proof)"'
        type: string
        default: ''

# The browser shards of ci.yml read the Build job's state.
permissions:
  contents: read
  actions: read

jobs:
  # Whether main's head already has a green full run (.github/scripts/main-full-run.sh decide, the
  # rule lib/testing/ci/full-run.ts). Only a scheduled run asks.
  decide:
    name: Decide
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read # find the newest full run
    outputs:
      head_has_full_run: ${{ steps.decide.outputs.head_has_full_run }}
    steps:
      # The rule diffs main since its newest full run; no step needs the job token in .git/config.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Decide whether the head has a full run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/main-full-run.sh decide

  full:
    # The release reuses a green full run on the commit it ships by this check name,
    # `Full run / Check` (.github/workflows/release.yml).
    name: Full run
    needs: decide
    # A skipped (manual) or failed decision leaves the output empty, so the full run starts.
    if: ${{ !cancelled() && !inputs.alert_proof && needs.decide.outputs.head_has_full_run != 'true' }}
    # A called workflow gets no permission its caller lacks: ci.yml's Unit job asks for pull-requests.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      full: Nightly run
    secrets: inherit

  quarantine:
    # A skipped test carries a quarantine comment that names its planning
    # issue (test-hygiene/no-excluded-test); the nightly summary lists them all.
    name: Quarantined tests
    if: ${{ !inputs.alert_proof }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup
      - run: bun scripts/list-quarantines.ts | tee -a "$GITHUB_STEP_SUMMARY"

  proof:
    name: Alert proof
    if: ${{ inputs.alert_proof }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: End as asked
        env:
          PROOF: ${{ inputs.alert_proof }}
        run: test "$PROOF" = success

  alert:
    name: Alert
    needs: [decide, full, quarantine, proof]
    # Only main speaks for the nightly, and a run a person cancelled or one that skipped a tested
    # head says nothing about it. Nothing needs this job and the release gate reads only
    # `Full run / Check`, so it changes no release.
    if: ${{ !cancelled() && needs.decide.outputs.head_has_full_run != 'true' && (github.ref == 'refs/heads/main' || inputs.alert_proof) }}
    # Two runs ending together must not both find no issue. release.yml's runs already queue.
    concurrency: nightly-alert
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # name the failed jobs
      issues: write # open, update and close the alert issue
    steps:
      # Only the script is read; no step needs the job token in .git/config.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Open, update or close the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "CI alert: nightly${{ inputs.alert_proof && ' (proof)' || '' }}"
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: bash .github/scripts/alert-issue.sh run "$TITLE" "$RESULTS"
