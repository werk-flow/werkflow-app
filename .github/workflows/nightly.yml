name: Nightly

# Every browser group on main once a night, so a date- or data-dependent
# failure surfaces without a change. 02:30 UTC stays clear of the runner's
# Berlin midnight window (MIDNIGHT_START_WINDOW in lib/testing/runner/group-schedule.ts).
# A manual run gives a main commit its full run before a release.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    # The release reuses a green full run on the commit it ships by this check name,
    # `Full run / Check` (.github/workflows/release.yml).
    name: Full run
    uses: ./.github/workflows/ci.yml
    with:
      full: Nightly run
    secrets: inherit
