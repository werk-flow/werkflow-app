name: Main green notice

# Tells each open PR whose `Check` failed that `main` is green again (docs/technical/coderabbit.md,
# "Babysit a pull request"). A PR's failed check stays red when `main` is fixed, and nothing else
# changes on the PR, so its thread's watch never wakes. This comment wakes it.
#
# It fires on the red-to-green turn of `main` only: a successful push run of CI on `main` whose
# previous completed push run failed. Main's state lives in those runs, because the merge queue
# lands each PR as a push to `main`; a queue run tests a commit that is not on `main` yet.
#
# It posts as `github-actions`, never as the owner: T3 Code's PR watch ignores comments by the
# watching account's own login, so a comment from the owner's account wakes nobody. A draft gets
# no comment: its `Check` fails by design while browser groups wait, and its thread pushes again
# before `gh pr ready`. A marker keyed by the green commit keeps a rerun from commenting twice.
#
# Like merge-queue-notice.yml, it checks nothing out, every event field reaches its script as data
# through `env`, and its log names PR numbers and commits only.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  notice:
    name: Notice
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # read the previous run of main
      checks: read # read each PR's Check
      pull-requests: write # list open PRs, read their comments and comment on them
    steps:
      - name: Comment on PRs with a failed Check
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ! [[ "$WORKFLOW_ID" =~ ^[0-9]+$ && "$RUN_NUMBER" =~ ^[0-9]+$ && "$RUN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error title=Main green notice::The event names no workflow, run number or commit.'
            exit 1
          fi
          # A cancelled or skipped run says nothing about main, so the run before it decides.
          if ! previous="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_ID/runs?branch=main&event=push&status=completed&per_page=30" \
            --jq "[.workflow_runs[] | select(.run_number < $RUN_NUMBER and .conclusion != \"cancelled\" and .conclusion != \"skipped\")] | max_by(.run_number) | .conclusion // \"\"")"; then
            echo '::error title=Main green notice::The previous run of main could not be read, so no PR hears that main is green.'
            exit 1
          fi
          if test "$previous" != failure && test "$previous" != timed_out; then
            echo "::notice title=Main green notice::The previous run of main ended '$previous', so main did not turn green now."
            exit 0
          fi
          prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open --limit 200 --json number,isDraft,headRefOid \
            --jq '.[] | select(.isDraft | not) | "\(.number) \(.headRefOid)"')"
          marker="<!-- main-green-notice $RUN_SHA -->"
          body="\`main\` is green again at $RUN_SHA. Merge \`main\` into this branch and let CI run again.

          $marker"
          posted=0
          unsent=0
          while read -r pr head <&3; do
            test -n "$pr" || continue
            # An unreadable Check or comment list still comments, so no thread sleeps on a stale failure.
            if check="$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/check-runs?check_name=Check&per_page=100" \
              --jq '[.check_runs[]] | max_by(.started_at) | .conclusion // ""')"; then
              if test "$check" != failure && test "$check" != timed_out; then continue; fi
            else
              echo "::warning title=Main green notice::The Check of PR #$pr could not be read, so it gets the comment."
            fi
            if seen="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr/comments?per_page=100" \
              --jq ".[] | select(.body | contains(\"$marker\")) | .id")"; then
              if test -n "$seen"; then
                echo "::notice title=Main green notice::PR #$pr already heard that main is green at $RUN_SHA."
                continue
              fi
            else
              echo "::warning title=Main green notice::The comments of PR #$pr could not be read, so it gets the comment."
            fi
            if gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$pr/comments" -f body="$body" > /dev/null; then
              echo "PR #$pr heard that main is green at $RUN_SHA."
              posted=$((posted + 1))
            else
              echo "::error title=Main green notice::The comment on PR #$pr failed."
              unsent=$((unsent + 1))
            fi
          done 3<<< "$prs"
          echo "::notice title=Main green notice::Main is green again at $RUN_SHA; $posted PRs heard of it."
          test "$unsent" -eq 0
