<h2>Passwort zurücksetzen</h2>
<p>Du hast angefordert, das Passwort deines WerkFlow-Kontos zurückzusetzen.</p>
<p>
  <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery"
